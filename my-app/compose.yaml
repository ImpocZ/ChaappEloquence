services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: chatting_app
      POSTGRES_USER: chatting_app
      POSTGRES_PASSWORD: "${PGPASSWORD:?Set PGPASSWORD in your env file}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ChattingApp.sql:/docker-entrypoint-initdb.d/00_chatting_app.sql:ro
      - ./migrations/01_add_auth_accounts.sql:/docker-entrypoint-initdb.d/01_add_auth_accounts.sql:ro
      - ./migrations/02_link_messages_to_memberships.sql:/docker-entrypoint-initdb.d/02_link_messages_to_memberships.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "chatting_app", "-d", "chatting_app"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      PORT: "3001"
      FRONTEND_ORIGIN: "http://localhost:5173"
      GITHUB_CALLBACK_URL: "http://localhost:3001/callback"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:?Set GITHUB_CLIENT_ID in your env file}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:?Set GITHUB_CLIENT_SECRET in your env file}"
      SECRET_KEY1: "${SECRET_KEY1:?Set SECRET_KEY1 in your env file}"
      SECRET_KEY2: "${SECRET_KEY2:?Set SECRET_KEY2 in your env file}"
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: chatting_app
      PGUSER: chatting_app
      PGPASSWORD: "${PGPASSWORD:?Set PGPASSWORD in your env file}"

volumes:
  postgres_data: